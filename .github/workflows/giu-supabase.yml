# Giữ Supabase (gói miễn phí) luôn hoạt động: mỗi ngày gọi vào web một lần.
# Supabase tạm dừng project miễn phí nếu ít hoạt động trong 7 ngày.
# Chạy tay: GitHub → Actions → "Giữ Supabase hoạt động" → Run workflow.
name: Giữ Supabase hoạt động

on:
  schedule:
    - cron: '17 1 * * *' # 08:17 sáng giờ Việt Nam, mỗi ngày
  workflow_dispatch:

permissions:
  actions: write # để tự gia hạn lịch chạy (xem bước cuối)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi vào web để đọc dữ liệu từ Supabase
        env:
          # Đổi địa chỉ web trong GitHub → Settings → Secrets and variables → Actions → Variables → SITE_URL
          SITE_URL: ${{ vars.SITE_URL || 'https://darla-website.vercel.app' }}
        run: |
          echo "Gọi $SITE_URL/api/giu-ket-noi"
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors --max-time 30 "$SITE_URL/api/giu-ket-noi"
          echo

      # GitHub tự tắt lịch chạy của repo công khai nếu repo không có hoạt động trong 60 ngày.
      # Bước này bật lại lịch mỗi lần chạy để tác vụ không bao giờ bị tắt.
      - name: Gia hạn lịch chạy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/giu-supabase.yml/enable" || true
